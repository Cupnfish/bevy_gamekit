<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#c8e5f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>emoji merge</title>
    <link data-trunk rel="rust" data-bin="bevy_emoji" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="emoji-merge/assets" />
    <style>
      :root {
        color-scheme: light;
        background: #111419;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #111419;
      }

      body {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #bevy-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 0;
        touch-action: none;
        image-rendering: pixelated;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      #loading {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border: 3px solid #505862;
        border-top-color: #f1cf55;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
        pointer-events: none;
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      :fullscreen,
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
        background: #111419;
      }

      @media (prefers-reduced-motion: reduce) {
        #loading {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bevy-canvas" tabindex="0" aria-label="emoji merge"></canvas>
    <div id="loading" role="status" aria-label="Loading"></div>
  </body>
</html>
