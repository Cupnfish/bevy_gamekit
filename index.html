<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#c8e5f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>emoji merge</title>
    <script>
      // Bevy 0.19 creates CPAL's AudioContext while the Wasm app is starting.
      // Browsers suspend that context because startup is not a user gesture, and
      // spawning an AudioPlayer later does not ask CPAL to resume it again.
      // Install this before Trunk loads Wasm so every Bevy AudioContext can be
      // resumed synchronously from the browser's native input callback.
      (() => {
        const state = {
          contexts: new Set(),
          constructors: new Map(),
          wrappers: new WeakSet(),
          lastResumeError: null,
        };

        Object.defineProperty(window, "__bevyEmojiAudioUnlock", {
          configurable: true,
          value: state,
        });

        const resumeContext = context => {
          if (context.state === "closed") {
            state.contexts.delete(context);
            return;
          }
          if (context.state === "running") return;

          try {
            const resumed = context.resume();
            if (resumed && resumed.catch) {
              resumed.catch(error => {
                // A later user gesture can retry if this browser rejects one.
                state.lastResumeError = String(error);
              });
            }
          } catch (error) {
            state.lastResumeError = String(error);
          }
        };

        const resumeAudio = event => {
          if (event && !event.isTrusted) return;
          state.lastResumeError = null;
          for (const context of Array.from(state.contexts)) {
            resumeContext(context);
          }
        };

        const trackAudioContext = context => {
          state.contexts.add(context);
          if (navigator.userActivation && navigator.userActivation.isActive) {
            resumeContext(context);
          }
          return context;
        };

        const wrapAudioContext = name => {
          const NativeAudioContext = window[name];
          if (typeof NativeAudioContext !== "function") return;
          if (state.wrappers.has(NativeAudioContext)) return;

          let WrappedAudioContext = state.constructors.get(NativeAudioContext);
          if (!WrappedAudioContext) {
            WrappedAudioContext = new Proxy(NativeAudioContext, {
              construct(target, args, newTarget) {
                const actualNewTarget =
                  newTarget === WrappedAudioContext ? target : newTarget;
                return trackAudioContext(
                  Reflect.construct(target, args, actualNewTarget),
                );
              },
            });
            state.constructors.set(NativeAudioContext, WrappedAudioContext);
            state.wrappers.add(WrappedAudioContext);
          }

          try {
            window[name] = WrappedAudioContext;
          } catch (_) {
            try {
              Object.defineProperty(window, name, {
                configurable: true,
                value: WrappedAudioContext,
                writable: true,
              });
            } catch (_) {}
          }
        };

        wrapAudioContext("AudioContext");
        wrapAudioContext("webkitAudioContext");

        for (const type of [
          "pointerdown",
          "touchstart",
          "touchend",
          "mousedown",
          "keydown",
        ]) {
          document.addEventListener(type, resumeAudio, {
            capture: true,
            passive: true,
          });
        }
      })();
    </script>
    <link data-trunk rel="rust" data-bin="bevy_emoji" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="emoji-merge/assets" />
    <style>
      :root {
        color-scheme: light;
        background: #111419;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #111419;
      }

      body {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #bevy-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 0;
        touch-action: none;
        image-rendering: pixelated;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      #loading {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border: 3px solid #505862;
        border-top-color: #f1cf55;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
        pointer-events: none;
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      :fullscreen,
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
        background: #111419;
      }

      @media (prefers-reduced-motion: reduce) {
        #loading {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bevy-canvas" tabindex="0" aria-label="emoji merge"></canvas>
    <div id="loading" role="status" aria-label="Loading"></div>
  </body>
</html>
