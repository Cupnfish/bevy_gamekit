name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch emoji-merge assets
        shell: bash
        run: |
          git init emoji-merge
          git -C emoji-merge remote add origin https://github.com/a327ex/emoji-merge.git
          git -C emoji-merge fetch --depth 1 origin 3b63aaa6b174f59cbcc3423ffafd558d60c876a5
          git -C emoji-merge checkout --detach FETCH_HEAD

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build web release
        run: trunk build --release --public-url ./

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
