[package]
name = "bevy_minigame_douyin"
version = "0.1.0"
edition = "2024"
description = "Douyin backend for bevy_minigame"
license = "MIT OR Apache-2.0"

[features]
default = ["bevy"]
bevy = ["bevy_minigame/bevy"]
cli = ["bevy_minigame/cli", "dep:anyhow", "dep:clap"]

[dependencies]
bevy_minigame = { path = "../bevy_minigame", default-features = false }
serde_json = "1"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "bevy-minigame-douyin"
path = "src/bin/bevy-minigame-douyin.rs"
required-features = ["cli"]
