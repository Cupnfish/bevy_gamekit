[package]
name = "bevy_agent_harness"
version = "0.1.0"
edition = "2024"
description = "Agent-oriented screenshot capture and input harness for Bevy"
license = "MIT OR Apache-2.0"

[features]
default = ["remote", "ci"]
remote = ["bevy/bevy_remote"]
ci = ["bevy/bevy_ci_testing"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_image",
    "bevy_log",
    "bevy_render",
    "bevy_ui",
    "bevy_window",
    "keyboard",
    "mouse",
    "touch",
    "serialize",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_asset",
] }
