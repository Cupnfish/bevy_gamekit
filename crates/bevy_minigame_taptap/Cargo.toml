[package]
name = "bevy_minigame_taptap"
version = "0.1.0"
edition = "2024"
description = "TapTap H5 backend for bevy_minigame"
license = "MIT OR Apache-2.0"

[features]
default = ["bevy"]
bevy = ["bevy_minigame/bevy", "dep:bevy_ecs"]
cli = ["bevy_minigame/cli", "dep:anyhow", "dep:clap"]

[dependencies]
bevy_minigame = { path = "../bevy_minigame", default-features = false }
bevy_ecs = { version = "0.20", optional = true }
serde_json = "1"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[[bin]]
name = "bevy-minigame-taptap"
path = "src/bin/bevy-minigame-taptap.rs"
required-features = ["cli"]
