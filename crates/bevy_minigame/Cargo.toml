[package]
name = "bevy_minigame"
version = "0.1.0"
edition = "2024"
description = "Cross-platform Mini Game runtime bridge and packaging engine for Bevy"
license = "MIT OR Apache-2.0"

[features]
default = ["bevy"]
bevy = ["dep:bevy"]
cli = ["dep:anyhow", "dep:clap", "dep:bevy_minigame_wasm_split"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "bevy_log"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
bevy_minigame_wasm_split = { path = "../bevy_minigame_wasm_split", default-features = false, features = ["cli"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tempfile = "3"
